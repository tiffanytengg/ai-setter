[project]
name = "agent-service"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=0.40",
    "mcp>=1.0,<2",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
